
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="浏览 MBLog 发布的文章。">
  <title>文章 · MBLog</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site.js" defer></script>
  <script src="js/blog.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">MBLog<span>.</span></a>
    <nav class="main-nav" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="blog.html" aria-current="page">文章</a>
      <a href="portfolio.html">作品</a>
      <a href="about.html">关于</a>
    </nav>
    <button id="theme-toggle" class="quiet theme-toggle" type="button">
      <span id="theme-label">切换主题</span>
    </button>
  </header>

  <main class="container">
    <section class="page-header">
      <p class="eyebrow">THE JOURNAL</p>
      <h1>所有文章</h1>
      <p>记录想法、分享经验，也保存一路探索的过程。</p>
    </section>

    <section class="content-section">
      <div class="form-field">
        <label for="post-search">搜索文章</label>
        <input id="post-search" type="search"
          placeholder="输入标题或关键词…" autocomplete="off">
      </div>

      <div id="blog-status" class="muted" role="status">
        正在加载文章……
      </div>

      <div id="blog-posts" class="post-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span data-year>2026</span> MBLog</p>
    <p>用心记录，持续创造。</p>
  </footer>
</body>
</html>
